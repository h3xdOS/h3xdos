# H3XD prompt, design 2a "powerline" variant: user, path and branch as flat tone blocks,
# a red ">" on the input line; on the right how long the last command took and how it
# ended, then the time. Read from /usr/share/h3xd unless the account has its own
# ~/.config/starship.toml.
add_newline = true
format = """
[ $username ](bg:#1793d1 fg:#0f1320 bold)\
[ $directory ](bg:#2b3240 fg:#e6edf3)\
$git_branch\
$python\
$line_break\
$character"""
right_format = "$cmd_duration$status$jobs$time"

[username]
show_always = true
format = "$user"

[directory]
format = "$path[$read_only](bg:#2b3240 fg:#f08a8e)"
truncation_length = 4
truncate_to_repo = false
home_symbol = "~"
read_only = " ro"

[git_branch]
format = "[ $branch ](bg:#3a1d22 fg:#f08a8e)"

[python]
format = "[ venv $virtualenv ](bg:#16301f fg:#6fd6a6)"
detect_extensions = []
detect_files = []

[cmd_duration]
min_time = 2_000
format = "[$duration ](fg:#e2b55a)"

[status]
disabled = false
format = "[exit $status ](fg:#f07075)"

[jobs]
format = "[$number jobs ](fg:#8b95a5)"

[time]
disabled = false
format = "[$time](fg:#8b95a5)"
time_format = "%H:%M"

[character]
success_symbol = "[>](bold fg:#e5484d)"
error_symbol = "[>](bold fg:#f07075)"
vimcmd_symbol = "[<](bold fg:#5cb6e4)"
