# Containers that h3xdos-box creates on first use. apt and sudo work inside them;
# the Arch host keeps pacman as its only package manager.
# The menu entries come from h3xdOS, so distrobox must not export its own.

[ubuntu]
image=docker.io/library/ubuntu:24.04
pull=true
entry=false

[kali]
image=docker.io/kalilinux/kali-rolling:latest
pull=true
entry=false
