# Swap in compressed RAM: on machines with little memory it keeps the desktop responsive
# where a swap partition on a slow disk would stall it. Override or disable it from
# /etc/systemd/zram-generator.conf.d/50-h3xdos.conf.
[zram0]
zram-size = min(ram / 2, 4096)
compression-algorithm = zstd
swap-priority = 100
