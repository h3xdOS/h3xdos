---
modules-search: [ local ]

instances:
  - id: removelive
    module: shellprocess
    config: shellprocess-removelive.conf
  - id: keyring
    module: shellprocess
    config: shellprocess-keyring.conf
  - id: options
    module: packagechooser
    config: packagechooser-options.conf
  - id: options
    module: shellprocess
    config: shellprocess-options.conf

# removelive runs before removeuser and users so that uid 1000 is free and the
# live-only files are gone before the initramfs and GRUB are generated.
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - packagechooser@options
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - shellprocess@removelive
      - removeuser
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - shellprocess@options
      - shellprocess@keyring
      - luksbootkeyfile
      - initcpiocfg
      - initcpio
      - grubcfg
      - bootloader
      - umount
  - show:
      - finished

branding: h3xdos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
