---
defaultGroups:
  - name: users
    must_exist: true
    system: true
  - lp
  - video
  - network
  - storage
  - name: wheel
    must_exist: false
    system: true
  - audio
  - name: autologin
    must_exist: false
    system: true

# Writes /etc/sudoers.d/10-installer with %wheel ALL=(ALL:ALL) ALL.
sudoersGroup: wheel
sudoersConfigureWithGroup: false
autologinGroup: autologin

# Root gets its own password fields; the Options page decides whether root may log in.
setRootPassword: true
doReusePassword: false
displayAutologin: true
doAutologin: false

passwordRequirements:
  minLength: 6
  maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: false

user:
  shell: /bin/bash
  forbidden_names: [ root ]
  home_permissions: "o700"

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "h3xdos"
  forbidden_names: [ localhost ]
