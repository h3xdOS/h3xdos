---
# Applies the Options page inside the target. packagechooser stores the chosen
# ids comma separated, so each check looks for ",id," in ",list,".
dontChroot: false
timeout: 60
script:
  - "case ',${gs[packagechooser_options]},' in *,root-account,*) ;; *) passwd -l root ;; esac"
  - "case ',${gs[packagechooser_options]},' in *,ssh-server,*) systemctl enable sshd.service ;; *) systemctl disable sshd.service ;; esac"
  - "case ',${gs[packagechooser_options]},' in *,ssh-root-login,*) echo 'PermitRootLogin yes' > /etc/ssh/sshd_config.d/20-h3xdos-root-login.conf ;; esac"
