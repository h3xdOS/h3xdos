---
overwrite: false
prefer_grub_d: false
keep_distributor: false
kernel_params: [ "quiet" ]
# gfxterm is required for the theme; the console terminal ignores GRUB_THEME.
defaults:
  GRUB_TIMEOUT: 5
  GRUB_DEFAULT: "0"
  GRUB_DISABLE_SUBMENU: true
  GRUB_TERMINAL_OUTPUT: "gfxterm"
  GRUB_DISABLE_RECOVERY: true
  GRUB_THEME: "/usr/share/grub/themes/h3xdos/theme.txt"
always_use_defaults: true
