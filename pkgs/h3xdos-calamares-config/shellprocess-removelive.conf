---
# Runs inside the target. Strips what only makes sense on the live medium,
# and restores the kernel image that mkarchiso removes from /boot.
dontChroot: false
timeout: 600
script:
  - "rm -f /etc/sudoers.d/10-h3x-live /etc/lightdm/lightdm.conf.d/90-h3xdos-live.conf"
  - "rm -f /etc/mkinitcpio.conf.d/archiso.conf"
  - "rm -f /etc/ssh/sshd_config.d/10-archiso.conf /etc/systemd/journald.conf.d/volatile-storage.conf /etc/systemd/logind.conf.d/do-not-suspend.conf"
  - "rm -f /etc/systemd/system/etc-pacman.d-gnupg.mount /etc/systemd/system/pacman-init.service /etc/systemd/system/choose-mirror.service /etc/systemd/system/livecd-talk.service /etc/systemd/system/livecd-alsa-unmuter.service"
  - "find /etc/systemd/system -xtype l -delete"
  - "rm -rf /usr/local/bin/choose-mirror /usr/local/bin/Installation_guide /usr/local/bin/livecd-sound /usr/local/share/livecd-sound /root/.automated_script.sh /root/.zlogin /etc/motd"
  - "cp /usr/lib/modules/$(ls /usr/lib/modules | head -n 1)/vmlinuz /boot/vmlinuz-linux"
  - "pacman -Rns --noconfirm calamares h3xdos-calamares-config mkinitcpio-archiso"
