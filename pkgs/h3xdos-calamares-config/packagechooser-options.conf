---
# Writes the chosen ids, comma separated, to packagechooser_options;
# shellprocess@options acts on them inside the target.
mode: optionalmultiple
method: legacy

labels:
  step: "Options"

items:
  - id: ""
    name: "Options"
    description: "Choose what this installation sets up besides the desktop. Every option can be changed later."
    screenshot: "/usr/share/h3xd/h3xd-mark.svg"
  - id: root-account
    name: "Root account"
    description: "Allow logging in as root with the root password from the Users page. Without this option root stays locked and administration goes through sudo."
    screenshot: "/usr/share/h3xd/h3xd-mark.svg"
  - id: ssh-server
    name: "SSH server"
    description: "Start the OpenSSH server at boot, so this computer accepts remote logins on port 22."
    screenshot: "/usr/share/h3xd/h3xd-mark.svg"
  - id: ssh-root-login
    name: "Root login over SSH"
    description: "Allow root to log in over SSH with a password. Takes effect only together with the SSH server and the root account."
    screenshot: "/usr/share/h3xd/h3xd-mark.svg"
