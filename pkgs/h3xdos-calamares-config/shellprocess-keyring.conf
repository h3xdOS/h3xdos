---
# The live medium keeps its keyring on a tmpfs, so the image itself carries none.
# mkarchiso also drops the sync databases; fetching them is optional so that an
# offline installation still finishes.
dontChroot: false
timeout: 900
script:
  - "pacman-key --init"
  - "pacman-key --populate archlinux"
  - "-pacman -Sy"
