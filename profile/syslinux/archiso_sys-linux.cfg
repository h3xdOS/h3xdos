LABEL arch
TEXT HELP
Boot the h3xdOS live medium on BIOS.
It runs the h3xdOS live system for installation or maintenance.
ENDTEXT
MENU LABEL h3xdOS live medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the h3xdOS live medium on BIOS with speakup screen reader.
It runs the h3xdOS live system for installation or maintenance with speech feedback.
ENDTEXT
MENU LABEL h3xdOS live medium (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS%
